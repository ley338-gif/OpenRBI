services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [control-plane]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [control-plane]

  clamav:
    image: clamav/clamav:1.3
    restart: unless-stopped
    networks: [control-plane]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres, redis]
    networks: [control-plane]
    # Deliberately no volume mount of /var/run/docker.sock — see
    # docs/adr/0005-no-docker-socket-in-backend.md. All sandbox lifecycle
    # operations go through session-agent's internal API instead.

  # The only component with container-runtime credentials (docs/adr/0004,
  # 0005). MUST NOT be reachable from the browser-plane network and MUST NOT
  # be exposed publicly through the reverse proxy.
  session-agent:
    build: ./session-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control-plane]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [control-plane]

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on: [backend, frontend]
    networks: [control-plane]

networks:
  # Single network for MVP 1 scaffolding. Phase 9 (network isolation)
  # introduces a dedicated, egress-filtered browser-plane network that
  # browser sandboxes join instead — never this one.
  control-plane:
    driver: bridge

volumes:
  postgres-data:
