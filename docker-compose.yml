services:
  # Vendor images below (postgres/redis/clamav) get no-new-privileges,
  # a real and safe restriction. cap_drop is deliberately NOT applied to
  # them: their own entrypoints need root-level setup capabilities
  # (chown/setuid data dirs, etc.) before dropping to their own unprivileged
  # runtime user, and blanket-stripping capabilities at the container level
  # risks breaking that startup sequence in ways that aren't worth the risk
  # for vendor-maintained images we don't control (Phase 20 hardening note
  # — see docs/security-model.md).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [control-plane]

  # BSD-3-Clause Redis-protocol-compatible fork, not Redis itself — see
  # docs/adr/0016-redis-to-valkey.md and DEPENDENCIES.md for why. Service
  # name/hostname stays "redis" deliberately: OPENRBI_REDIS_URL
  # (.env.example) and every consumer (app/core/redis.py, health checks,
  # e2e assertions) address it by that name, and nothing about the
  # protocol or client library changed, only which image implements it.
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [control-plane]

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [control-plane]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on: [postgres, redis]
    # Roadmap B2.4 (docs/adr/0024-cross-host-display-relay.md) — backend no
    # longer needs a route to a sandbox's VNC port at all: the display relay
    # now terminates at each node's own Session Agent (see that service's
    # own browser-plane membership below), reachable over control-plane like
    # every other Session Agent call. Backend previously multi-homed onto
    # browser-plane specifically for this; it has no remaining reason to be
    # on that network.
    networks: [control-plane]
    volumes:
      # Interim local staging for intercepted downloads (Phase 13) —
      # replaced by a real quarantine-storage abstraction in Phase 15.
      - quarantine-staging:/app/data
      # RBI-POST-001: uncomment and point at your internal CA's PEM bundle
      # if LDAPS uses a certificate issued by a private/internal CA, then
      # set OPENRBI_LDAP_CA_CERT_FILE=/etc/openrbi/ldap-ca.pem in .env.
      # Read-only; never required for a publicly-issued LDAPS certificate.
      # - ./config/ldap-ca.pem:/etc/openrbi/ldap-ca.pem:ro
      # RBI-POST-002: read-only marker written by
      # scripts/setup-network-isolation.sh on the Docker host — this is how
      # the backend's health status can tell "isolation was verifiably
      # applied recently" apart from "docker compose up alone, isolation
      # was never set up" without granting the container any host/root
      # access. Docker creates this host directory automatically (empty) if
      # it doesn't exist yet, which is exactly the correct "not configured"
      # starting state. See docs/deployment.md#network-isolation.
      - /var/lib/openrbi/network-isolation:/etc/openrbi/network-isolation:ro
    # Deliberately no volume mount of /var/run/docker.sock — see
    # docs/adr/0005-no-docker-socket-in-backend.md. All sandbox lifecycle
    # operations go through session-agent's internal API instead.

  # The only component with container-runtime credentials (docs/adr/0004,
  # 0005). MUST NOT be reachable from the browser-plane network and MUST NOT
  # be exposed publicly through the reverse proxy.
  session-agent:
    build: ./session-agent
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Found on real infrastructure, not caught by CI (RBI-POST — real
    # upgrade-acceptance run against genuine ghcr.io images on a fresh
    # Linux host): session-agent's non-root user (uid 10001, primary group
    # 0 — session-agent/Dockerfile) has no access to docker.sock on a real
    # host. docker.sock is normally root:<docker-group> mode 660, and the
    # docker group's GID is essentially never 0 on a real install — CI
    # only ever worked because its runner-setup step separately chmods the
    # socket to 666, which is explicitly documented there as a
    # CI-runner-only workaround, never something a real deployment does.
    # group_add supplies the host's actual docker-group GID as a
    # *supplementary* group at container-start time — no image rebuild,
    # no baked-in host-specific GID, works with whatever group_add
    # says regardless of the image's user/group config. Fails closed
    # (docker compose refuses to start at all) if unset, same convention
    # already used for POSTGRES_USER/PASSWORD/DB above — see
    # docs/deployment.md#installation for how to determine and set it.
    group_add:
      - "${OPENRBI_DOCKER_SOCKET_GID:?set this to the docker socket's group ID on this host — run: stat -c '%g' /var/run/docker.sock — see docs/deployment.md#installation}"
    # Roadmap B2.4 (docs/adr/0024-cross-host-display-relay.md) — multi-homed
    # onto browser-plane, taking over the role backend used to hold: this
    # process is the one that now dials a sandbox's VNC port (the new
    # /v1/sandboxes/{id}/display/ws relay and /display/ready probe), and it
    # genuinely lives on this node's own local browser-plane bridge, unlike
    # the control plane once a node is on a different host. Pinned to a
    # static address for the same reason backend's used to be pinned:
    # scripts/setup-network-isolation.sh must be able to tell "this node's
    # own relay leg" apart from an actual sandbox by IP alone. Same numeric
    # default as the address it replaces (172.30.0.2) — an un-overridden
    # single-node deployment needs no operator action on upgrade.
    networks:
      control-plane:
      browser-plane:
        # Same variable scripts/setup-network-isolation.sh reads for its
        # exemption default — one source of truth for "this node's relay
        # address" between the two. Override together with
        # OPENRBI_BROWSER_PLANE_SUBNET if you change that subnet; the
        # address must fall inside it.
        ipv4_address: ${OPENRBI_AGENT_BROWSER_PLANE_IP:-172.30.0.2}

  frontend:
    build:
      # Root context (not ./frontend) so the image can also copy in
      # docs/*.md for the portals' Help menus — real, always-in-sync
      # documentation links instead of a hardcoded GitHub URL that would
      # break for an offline/local deployment.
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # NET_BIND_SERVICE: bind port 80. CHOWN/SETUID/SETGID: nginx's own
    # startup privilege drop from root to the unprivileged "nginx" worker
    # user (see docker/nginx/nginx.conf's "user nginx;") — without these,
    # nginx either fails outright (chown of its temp dirs errors) or, if the
    # config omits "user", silently never drops at all, which is worse.
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    networks: [control-plane]

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # NET_BIND_SERVICE: bind port 80. CHOWN/SETUID/SETGID: nginx's own
    # startup privilege drop from root to the unprivileged "nginx" worker
    # user (see docker/nginx/nginx.conf's "user nginx;") — without these,
    # nginx either fails outright (chown of its temp dirs errors) or, if the
    # config omits "user", silently never drops at all, which is worse.
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on: [backend, frontend]
    networks: [control-plane]

networks:
  control-plane:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # Browser sandboxes join only this network (session-agent/app/config.py),
  # never control-plane. scripts/setup-network-isolation.sh blocks it from
  # reaching RFC1918/link-local/loopback/etc, every other docker network on
  # the host, and the host's own IPs — see docs/security-model.md.
  # enable_ipv6 is deliberately omitted (disabled): rather than replicate
  # the IPv4 blocklist for IPv6, no IPv6 connectivity exists for sandboxes
  # at all, which is the strictly more restrictive choice.
  browser-plane:
    driver: bridge
    ipam:
      config:
        # Roadmap B2.4 — a documented per-deployment override, not a
        # hardcoded value, so a second host's own compose file (Roadmap
        # B2.6) can pick a distinct, non-colliding range for its own
        # local browser-plane (e.g. 172.30.1.0/24, 172.30.2.0/24, ...).
        # Unset, this is the same 172.30.0.0/24 every prior release used.
        - subnet: ${OPENRBI_BROWSER_PLANE_SUBNET:-172.30.0.0/24}

volumes:
  postgres-data:
  quarantine-staging:
