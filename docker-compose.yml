services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [control-plane]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [control-plane]

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    networks: [control-plane]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres, redis]
    # Multi-homed deliberately: backend needs a route to a sandbox's VNC
    # port for the Phase 8 display relay. Pinned to a static address on
    # browser-plane because scripts/setup-network-isolation.sh must be able
    # to tell "backend's own leg on this network" apart from an actual
    # sandbox by IP alone — both otherwise live in the same subnet. The
    # script exempts exactly this address for NEW connections; every other
    # address on browser-plane (i.e. every real sandbox) still cannot open
    # a NEW connection into the control plane, only backend can initiate.
    networks:
      control-plane:
      browser-plane:
        ipv4_address: 172.30.0.2
    volumes:
      # Interim local staging for intercepted downloads (Phase 13) —
      # replaced by a real quarantine-storage abstraction in Phase 15.
      - quarantine-staging:/app/data
    # Deliberately no volume mount of /var/run/docker.sock — see
    # docs/adr/0005-no-docker-socket-in-backend.md. All sandbox lifecycle
    # operations go through session-agent's internal API instead.

  # The only component with container-runtime credentials (docs/adr/0004,
  # 0005). MUST NOT be reachable from the browser-plane network and MUST NOT
  # be exposed publicly through the reverse proxy.
  session-agent:
    build: ./session-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control-plane]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [control-plane]

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on: [backend, frontend]
    networks: [control-plane]

networks:
  control-plane:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # Browser sandboxes join only this network (session-agent/app/config.py),
  # never control-plane. scripts/setup-network-isolation.sh blocks it from
  # reaching RFC1918/link-local/loopback/etc, every other docker network on
  # the host, and the host's own IPs — see docs/security-model.md.
  # enable_ipv6 is deliberately omitted (disabled): rather than replicate
  # the IPv4 blocklist for IPv6, no IPv6 connectivity exists for sandboxes
  # at all, which is the strictly more restrictive choice.
  browser-plane:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  quarantine-staging:
