# Compact deployment: serves the User Portal SPA at "/" and the Admin
# Portal SPA at "/admin/" from the same nginx container (see Dockerfile's
# comment on why this isn't a network boundary). Replaces only this site's
# server block — the image's own /etc/nginx/nginx.conf (with "user nginx;",
# see docs/security-model.md#control-plane-container-hardening-phase-20)
# is untouched, so the existing privilege-drop still applies.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
