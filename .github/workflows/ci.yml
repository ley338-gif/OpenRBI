name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    name: Python lint and type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            session-agent/requirements-dev.lock
      - name: Install quality tools
        run: python -m pip install "ruff==0.12.11" "mypy==1.17.1" "uv==0.8.13"
      - name: Check Python dependency locks are current
        run: |
          sh scripts/lock-python-dependencies.sh
          git diff --exit-code -- backend/requirements.lock backend/requirements-dev.lock session-agent/requirements.lock session-agent/requirements-dev.lock
      - name: Ruff
        run: ruff check backend/app backend/tests backend/migrations session-agent/app session-agent/tests scripts/fresh-install-acceptance.py scripts/backup-restore-acceptance.py scripts/upgrade-acceptance.py scripts/security-release-review.py scripts/fault-injection-probe.py scripts/check-v1-acceptance.py scripts/check-docs-freeze.py
      - name: Check component version synchronization
        run: python scripts/check-version-sync.py
      - name: Validate binding v1 acceptance manifest
        run: python scripts/check-v1-acceptance.py
      - name: Validate documentation freeze
        run: python scripts/check-docs-freeze.py
      - name: Type-check backend
        working-directory: backend
        run: mypy app --ignore-missing-imports
      - name: Type-check session agent
        working-directory: session-agent
        run: mypy app --ignore-missing-imports
      - name: Install session agent dependencies
        working-directory: session-agent
        run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - name: Run session agent unit tests
        # Roadmap B3.1 (docs/roadmap-b3-capacity-autoscaling.md) — the
        # first session-agent-side pytest suite (tests/test_capacity.py).
        # Pure unit tests (no Docker/live stack needed, unlike backend's
        # own integration suite) so this runs directly on the runner, not
        # inside a container.
        working-directory: session-agent
        run: PYTHONPATH=. pytest tests/ -v

  dependency-scan-python:
    name: Python dependency scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, session-agent]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements.lock
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.9.0"
      - name: Audit resolved production dependencies
        run: pip-audit --requirement "${{ matrix.component }}/requirements.lock" --require-hashes --disable-pip --strict --progress-spinner off

  fresh-install-acceptance:
    name: Fresh install acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Allow session-agent's non-root user to reach the runner's docker.sock
        # The acceptance run exercises a real sandbox session. GitHub-hosted
        # runners use a separate docker group, while the hardened agent runs as
        # uid 10001/gid 0. This permission change is scoped to the ephemeral VM.
        run: sudo chmod 666 /var/run/docker.sock
      - name: Build and accept a clean installation
        run: ./scripts/run-fresh-install-acceptance.sh

  backup-restore-acceptance:
    name: Backup and restore acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Allow session-agent's non-root user to reach the runner's docker.sock
        run: sudo chmod 666 /var/run/docker.sock
      - name: Back up, corrupt, restore, and functionally verify the current schema
        run: ./scripts/run-backup-restore-acceptance.sh

  upgrade-acceptance:
    name: Upgrade acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Allow session-agent's non-root user to reach the runner's docker.sock
        run: sudo chmod 666 /var/run/docker.sock
      - name: Upgrade pinned 0.1.1 state to the current v1 candidate
        run: ./scripts/run-upgrade-acceptance.sh

  # Roadmap Phase A / A5: dependency & image scanning. Builds every image
  # OpenRBI actually ships (backend, session-agent, frontend, the browser
  # sandbox) and fails the build on a known CRITICAL vulnerability that
  # isn't explicitly documented in .trivyignore (see that file for why
  # each currently-listed CVE is there — every entry was individually
  # verified to have no upstream fix yet, not silently suppressed).
  image-scan:
    name: Image vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openrbi-backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: openrbi-session-agent
            context: session-agent
            dockerfile: session-agent/Dockerfile
          - image: openrbi-frontend
            # Repo root, not frontend/ itself: frontend/Dockerfile's COPY
            # paths (package.json under frontend/, plus COPY docs/ for the
            # real Help-menu links added by the UI-polish pass) all assume
            # this context, matching docker-compose.yml's own frontend
            # build config.
            context: .
            dockerfile: frontend/Dockerfile
          - image: openrbi-browser
            context: docker/browser
            dockerfile: docker/browser/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.image }}
        run: docker build -t ${{ matrix.image }}:ci -f ${{ matrix.dockerfile }} ${{ matrix.context }}

      - name: Scan ${{ matrix.image }} for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          scanners: vuln
          severity: CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

  # Node dependency scan for the frontend workspace. The final frontend
  # image is a static nginx build — node_modules never ships in it, so
  # the image-scan job above can't see npm-level vulnerabilities at all;
  # this is the only place they're actually checked.
  dependency-scan-frontend:
    name: Frontend dependency scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --audit-level=critical
      - name: Build portals and reject backend secret identifiers in the client bundle
        working-directory: frontend
        run: |
          npm run build --workspace=user
          npm run build --workspace=admin
          if grep -R -E 'OPENRBI_(AGENT_API_TOKEN|SESSION_AGENT_API_TOKEN|TOTP_SECRET_ENCRYPTION_KEY|DATABASE_URL)|POSTGRES_PASSWORD' user/dist admin/dist; then
            echo "A backend-only secret identifier reached the frontend bundle" >&2
            exit 1
          fi

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the complete Git history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact=100

  # Roadmap Phase A / A3: runs the existing backend/tests/ pytest suite
  # (previously only ever run manually via scripts/run-integration-tests.sh)
  # plus the new automated regression tests for the threat-model.md
  # controls (network isolation, fail-closed on scanner outage, sandbox
  # session isolation) that scripts/run-security-tests.sh could previously
  # only check by hand on a host with Docker socket access.
  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Allow session-agent's non-root user to reach the runner's docker.sock
        # session-agent runs as uid 10001, group 0 — deliberately not full
        # root (Phase 20 hardening) but still in group 0 specifically
        # because a real deployment host's docker.sock is typically
        # root:root or root:docker with group read-write (see
        # session-agent/Dockerfile's own comment). GitHub-hosted runners
        # instead put it in a real, separate "docker" group unrelated to
        # GID 0, so that assumption doesn't hold here. This only loosens
        # the *runner VM's* socket permissions for this ephemeral job, not
        # anything about the image or its hardening.
        run: sudo chmod 666 /var/run/docker.sock
      - name: Build and start the stack
        run: |
          # Phase 20's fail-closed startup check rejects .env.example's
          # literal placeholder secrets (docs/security-model.md), so a
          # plain `cp .env.example .env` would never actually boot —
          # generate real random values for every secret CI needs instead.
          # DB_PASSWORD is substituted into both POSTGRES_PASSWORD and the
          # embedded credential in OPENRBI_DATABASE_URL so they still match.
          cp .env.example .env
          DB_PASSWORD=$(openssl rand -hex 32)
          sed -i "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=${DB_PASSWORD}#" .env
          sed -i "s#^OPENRBI_DATABASE_URL=.*#OPENRBI_DATABASE_URL=postgresql+asyncpg://openrbi:${DB_PASSWORD}@postgres:5432/openrbi#" .env
          # OPENRBI_SESSION_AGENT_API_TOKEN (backend, the token it sends) and
          # OPENRBI_AGENT_API_TOKEN (session-agent, what it validates
          # incoming requests against) must be the *same* shared secret —
          # see CHANGELOG's Hardening entry for the real bug this exact
          # mismatch caused when both sides silently matched on the
          # placeholder instead.
          AGENT_TOKEN=$(openssl rand -hex 32)
          sed -i "s#^OPENRBI_SESSION_AGENT_API_TOKEN=.*#OPENRBI_SESSION_AGENT_API_TOKEN=${AGENT_TOKEN}#" .env
          sed -i "s#^OPENRBI_AGENT_API_TOKEN=.*#OPENRBI_AGENT_API_TOKEN=${AGENT_TOKEN}#" .env
          sed -i "s#^OPENRBI_TOTP_SECRET_ENCRYPTION_KEY=.*#OPENRBI_TOTP_SECRET_ENCRYPTION_KEY=$(openssl rand -hex 32)#" .env
          sed -i "s#^OPENRBI_CSRF_SECRET_KEY=.*#OPENRBI_CSRF_SECRET_KEY=$(openssl rand -hex 32)#" .env
          echo "OPENRBI_DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
          # Roadmap B3.1 (docs/roadmap-b3-capacity-autoscaling.md) — real
          # capacity is now derived from this runner's actual free RAM/CPU.
          # This suite's own session-scoped test cleanup (tests/conftest.py)
          # means several real sandbox containers can be alive at once
          # across a full run, not just within one test — a ceiling alone
          # (OPENRBI_AGENT_CAPACITY) can only ever *lower* an already-higher
          # computed value, so it doesn't help when the computed value
          # itself is the constraint, confirmed by a real CI run: also
          # shrinking the per-sandbox reservation the computation divides
          # by (default_ram_limit_mb) is what actually restores the old
          # suite's effective headroom on a runner with finite RAM. 1024 MB
          # is still a real, functional limit for a short-lived automated
          # test's Firefox+Xvfb+x11vnc sandbox (verified against the real
          # noVNC/canvas E2E path), just not full production sizing.
          echo "OPENRBI_AGENT_CAPACITY=20" >> .env
          echo "OPENRBI_AGENT_DEFAULT_RAM_LIMIT_MB=1024" >> .env
          # CPU turned out to be the actual binding constraint on a real
          # runner, not RAM — the RAM-only fix above alone did not resolve
          # this, confirmed by a second real CI run still failing
          # identically. Shrinking the CPU reservation the same way closes
          # the gap; still a real, functional CPU allocation for a
          # short-lived automated test's Firefox+Xvfb+x11vnc sandbox
          # (verified against the real noVNC/canvas E2E path).
          #
          # Roadmap B3.2 retune: a real B3.1 bug meant CPU-derived capacity
          # barely reacted to real load on a multi-core runner (psutil's
          # 0-100 host-wide average was treated as if already scaled by
          # core count). Now that this is fixed, the 0.5 reservation above
          # no longer matches real accumulated test load on this runner —
          # confirmed by a real CI run failing with NoCapacityError right
          # after the fix landed. Shrunk further (0.5 -> 0.2) so the same
          # real free CPU still divides into enough sandbox slots.
          echo "OPENRBI_AGENT_DEFAULT_CPU_LIMIT=0.2" >> .env
          docker compose up -d --build
      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" && break
            if [ "$i" -eq 30 ]; then
              echo "Backend did not become healthy within 60 seconds" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Wait for PostgreSQL to accept connections
        # /health is intentionally a liveness-only endpoint and therefore
        # does not prove that PostgreSQL is ready. Alembic must not race a
        # freshly-created database container during CI startup.
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U openrbi -d openrbi && break
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL did not become ready within 60 seconds" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Apply database migrations
        # A fresh Postgres volume has no schema at all until this runs —
        # docs/deployment.md's own install/update procedures always call
        # this explicitly, it's never automatic on container start.
        run: docker compose exec -T backend alembic upgrade head
      - name: Build browser sandbox image
        # Must happen before the integration tests below: session-agent's
        # DockerSandboxProvider needs this image to exist to create a real
        # sandbox, and test_isolate_disconnect_kill_are_audited_and_kill_
        # is_admin_only does exactly that.
        run: docker build -t openrbi-browser:latest -f docker/browser/Dockerfile docker/browser
      - name: Run integration tests
        run: sh scripts/run-integration-tests.sh
      - name: Apply network isolation rules
        # GitHub-hosted ubuntu-latest runners run real Docker with a real
        # DOCKER-USER iptables chain (not nested/rootless), same as the
        # bare-metal/VM host this script targets in docs/deployment.md.
        run: sudo sh scripts/setup-network-isolation.sh
      - name: Run host-level security regression tests
        run: sh scripts/run-security-tests.sh
      - name: Run destructive fault-injection acceptance
        # This job owns an isolated ephemeral runner/Compose stack.  The
        # script deliberately kills and restarts its containers and must
        # never be pointed at a production deployment.
        run: sh scripts/run-fault-injection-tests.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # Roadmap Phase B / B1.2-B1.6, closing a gap noted since A5: the LDAP
  # test scripts were deliberately never wired into backend-integration-
  # tests above, because the HTTP-level runner needs its own backend
  # process with different OPENRBI_LDAP_* env (the running uvicorn process
  # only reads Settings() once). A separate job on its own fresh runner VM
  # (GitHub Actions gives
  # every job an isolated environment by default, no shared containers or
  # filesystem with backend-integration-tests) sidesteps that entirely: a
  # LDAP-specific backend here can't affect anything else.
  ldap-integration-tests:
    name: LDAP integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Allow session-agent's non-root user to reach the runner's docker.sock
        run: sudo chmod 666 /var/run/docker.sock
      - name: Build and start the stack
        run: |
          cp .env.example .env
          DB_PASSWORD=$(openssl rand -hex 32)
          sed -i "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=${DB_PASSWORD}#" .env
          sed -i "s#^OPENRBI_DATABASE_URL=.*#OPENRBI_DATABASE_URL=postgresql+asyncpg://openrbi:${DB_PASSWORD}@postgres:5432/openrbi#" .env
          AGENT_TOKEN=$(openssl rand -hex 32)
          sed -i "s#^OPENRBI_SESSION_AGENT_API_TOKEN=.*#OPENRBI_SESSION_AGENT_API_TOKEN=${AGENT_TOKEN}#" .env
          sed -i "s#^OPENRBI_AGENT_API_TOKEN=.*#OPENRBI_AGENT_API_TOKEN=${AGENT_TOKEN}#" .env
          sed -i "s#^OPENRBI_TOTP_SECRET_ENCRYPTION_KEY=.*#OPENRBI_TOTP_SECRET_ENCRYPTION_KEY=$(openssl rand -hex 32)#" .env
          sed -i "s#^OPENRBI_CSRF_SECRET_KEY=.*#OPENRBI_CSRF_SECRET_KEY=$(openssl rand -hex 32)#" .env
          echo "OPENRBI_DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
          # Roadmap B3.1 (docs/roadmap-b3-capacity-autoscaling.md) — real
          # capacity is now derived from this runner's actual free RAM/CPU.
          # This suite's own session-scoped test cleanup (tests/conftest.py)
          # means several real sandbox containers can be alive at once
          # across a full run, not just within one test — a ceiling alone
          # (OPENRBI_AGENT_CAPACITY) can only ever *lower* an already-higher
          # computed value, so it doesn't help when the computed value
          # itself is the constraint, confirmed by a real CI run: also
          # shrinking the per-sandbox reservation the computation divides
          # by (default_ram_limit_mb) is what actually restores the old
          # suite's effective headroom on a runner with finite RAM. 1024 MB
          # is still a real, functional limit for a short-lived automated
          # test's Firefox+Xvfb+x11vnc sandbox (verified against the real
          # noVNC/canvas E2E path), just not full production sizing.
          echo "OPENRBI_AGENT_CAPACITY=20" >> .env
          echo "OPENRBI_AGENT_DEFAULT_RAM_LIMIT_MB=1024" >> .env
          # CPU turned out to be the actual binding constraint on a real
          # runner, not RAM — the RAM-only fix above alone did not resolve
          # this, confirmed by a second real CI run still failing
          # identically. Shrinking the CPU reservation the same way closes
          # the gap; still a real, functional CPU allocation for a
          # short-lived automated test's Firefox+Xvfb+x11vnc sandbox
          # (verified against the real noVNC/canvas E2E path).
          #
          # Roadmap B3.2 retune: a real B3.1 bug meant CPU-derived capacity
          # barely reacted to real load on a multi-core runner (psutil's
          # 0-100 host-wide average was treated as if already scaled by
          # core count). Now that this is fixed, the 0.5 reservation above
          # no longer matches real accumulated test load on this runner —
          # confirmed by a real CI run failing with NoCapacityError right
          # after the fix landed. Shrunk further (0.5 -> 0.2) so the same
          # real free CPU still divides into enough sandbox slots.
          echo "OPENRBI_AGENT_DEFAULT_CPU_LIMIT=0.2" >> .env
          docker compose up -d --build
      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" && break
            if [ "$i" -eq 30 ]; then
              echo "Backend did not become healthy within 60 seconds" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U openrbi -d openrbi && break
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL did not become ready within 60 seconds" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Apply database migrations
        run: docker compose exec -T backend alembic upgrade head
      - name: Run LdapAuthProvider tests (real throwaway LDAP server, no backend restart)
        run: sh scripts/run-ldap-tests.sh
      - name: Run HTTP-level LDAP login/admin-config tests (isolated backend with real throwaway LDAP)
        run: sh scripts/run-ldap-integration-tests.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      # Always torn down, success or failure — this job's whole point is
      # that its own throwaway backend and LDAP containers never
      # linger or affect anything else, matching the isolation the
      # existing LDAP scripts already apply to themselves (their own traps
      # remove throwaway containers even on failure)
      # one level up, at the runner/stack level.
      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # Roadmap follow-up: wires the real, no-mock Playwright suite
  # (frontend/e2e/, docs/development.md's "Tests" section) into CI as a
  # required gate. Previously this suite only ran when a developer
  # manually invoked scripts/e2e-run.sh, so real portal-UI regressions
  # (e.g. RBI-POST-025's Admin Portal role-guard bug) could merge and
  # ship without it ever running. Reuses the same real Compose stack
  # setup as backend-integration-tests above (own isolated runner VM —
  # no shared containers/filesystem with that job) and additionally
  # builds the browser sandbox image, since one test drives a real
  # Secure Browser session through a genuine noVNC connection.
  frontend-e2e-tests:
    name: Frontend E2E tests (Playwright)
    runs-on: ubuntu-latest
    # 20 minutes was too tight: every setup step (stack build/start,
    # migrations, browser image, Playwright/Chromium install) completed
    # well within budget on a real run, but the suite itself -- dozens of
    # real portal-UI scenarios including a genuine noVNC-connected Secure
    # Browser session -- got cancelled mid-run by the timeout, not by any
    # actual test failure (see CI run 31905214589).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Allow session-agent's non-root user to reach the runner's docker.sock
        run: sudo chmod 666 /var/run/docker.sock
      - name: Build and start the stack
        run: |
          cp .env.example .env
          DB_PASSWORD=$(openssl rand -hex 32)
          sed -i "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=${DB_PASSWORD}#" .env
          sed -i "s#^OPENRBI_DATABASE_URL=.*#OPENRBI_DATABASE_URL=postgresql+asyncpg://openrbi:${DB_PASSWORD}@postgres:5432/openrbi#" .env
          AGENT_TOKEN=$(openssl rand -hex 32)
          sed -i "s#^OPENRBI_SESSION_AGENT_API_TOKEN=.*#OPENRBI_SESSION_AGENT_API_TOKEN=${AGENT_TOKEN}#" .env
          sed -i "s#^OPENRBI_AGENT_API_TOKEN=.*#OPENRBI_AGENT_API_TOKEN=${AGENT_TOKEN}#" .env
          sed -i "s#^OPENRBI_TOTP_SECRET_ENCRYPTION_KEY=.*#OPENRBI_TOTP_SECRET_ENCRYPTION_KEY=$(openssl rand -hex 32)#" .env
          sed -i "s#^OPENRBI_CSRF_SECRET_KEY=.*#OPENRBI_CSRF_SECRET_KEY=$(openssl rand -hex 32)#" .env
          echo "OPENRBI_DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
          # Roadmap B3.1 (docs/roadmap-b3-capacity-autoscaling.md) — real
          # capacity is now derived from this runner's actual free RAM/CPU.
          # This suite's own session-scoped test cleanup (tests/conftest.py)
          # means several real sandbox containers can be alive at once
          # across a full run, not just within one test — a ceiling alone
          # (OPENRBI_AGENT_CAPACITY) can only ever *lower* an already-higher
          # computed value, so it doesn't help when the computed value
          # itself is the constraint, confirmed by a real CI run: also
          # shrinking the per-sandbox reservation the computation divides
          # by (default_ram_limit_mb) is what actually restores the old
          # suite's effective headroom on a runner with finite RAM. 1024 MB
          # is still a real, functional limit for a short-lived automated
          # test's Firefox+Xvfb+x11vnc sandbox (verified against the real
          # noVNC/canvas E2E path), just not full production sizing.
          echo "OPENRBI_AGENT_CAPACITY=20" >> .env
          echo "OPENRBI_AGENT_DEFAULT_RAM_LIMIT_MB=1024" >> .env
          # CPU turned out to be the actual binding constraint on a real
          # runner, not RAM — the RAM-only fix above alone did not resolve
          # this, confirmed by a second real CI run still failing
          # identically. Shrinking the CPU reservation the same way closes
          # the gap; still a real, functional CPU allocation for a
          # short-lived automated test's Firefox+Xvfb+x11vnc sandbox
          # (verified against the real noVNC/canvas E2E path).
          #
          # Roadmap B3.2 retune: a real B3.1 bug meant CPU-derived capacity
          # barely reacted to real load on a multi-core runner (psutil's
          # 0-100 host-wide average was treated as if already scaled by
          # core count). Now that this is fixed, the 0.5 reservation above
          # no longer matches real accumulated test load on this runner —
          # confirmed by a real CI run failing with NoCapacityError right
          # after the fix landed. Shrunk further (0.5 -> 0.2) so the same
          # real free CPU still divides into enough sandbox slots.
          echo "OPENRBI_AGENT_DEFAULT_CPU_LIMIT=0.2" >> .env
          docker compose up -d --build
      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" && break
            if [ "$i" -eq 30 ]; then
              echo "Backend did not become healthy within 60 seconds" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U openrbi -d openrbi && break
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL did not become ready within 60 seconds" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Apply database migrations
        run: docker compose exec -T backend alembic upgrade head
      - name: Build browser sandbox image
        # The Secure Browser E2E test creates a real sandbox session
        # (DockerSandboxProvider), same reason backend-integration-tests
        # builds this image before its own integration tests.
        run: docker build -t openrbi-browser:latest -f docker/browser/Dockerfile docker/browser
      - name: Install Playwright and its Chromium browser
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the real, no-mock Playwright E2E suite
        run: sh scripts/e2e-run.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Upload Playwright trace/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  release-gates:
    name: Release gates
    if: always()
    needs:
      - python-quality
      - dependency-scan-python
      - fresh-install-acceptance
      - backup-restore-acceptance
      - upgrade-acceptance
      - image-scan
      - dependency-scan-frontend
      - secret-scan
      - backend-integration-tests
      - ldap-integration-tests
      - frontend-e2e-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every release gate
        env:
          PYTHON_QUALITY: ${{ needs.python-quality.result }}
          PYTHON_DEPENDENCIES: ${{ needs.dependency-scan-python.result }}
          FRESH_INSTALL: ${{ needs.fresh-install-acceptance.result }}
          BACKUP_RESTORE: ${{ needs.backup-restore-acceptance.result }}
          UPGRADE_ACCEPTANCE: ${{ needs.upgrade-acceptance.result }}
          IMAGE_SCAN: ${{ needs.image-scan.result }}
          FRONTEND_DEPENDENCIES: ${{ needs.dependency-scan-frontend.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          BACKEND_INTEGRATION: ${{ needs.backend-integration-tests.result }}
          LDAP_INTEGRATION: ${{ needs.ldap-integration-tests.result }}
          FRONTEND_E2E: ${{ needs.frontend-e2e-tests.result }}
        run: |
          for result in \
            "$PYTHON_QUALITY" \
            "$PYTHON_DEPENDENCIES" \
            "$FRESH_INSTALL" \
            "$BACKUP_RESTORE" \
            "$UPGRADE_ACCEPTANCE" \
            "$IMAGE_SCAN" \
            "$FRONTEND_DEPENDENCIES" \
            "$SECRET_SCAN" \
            "$BACKEND_INTEGRATION" \
            "$LDAP_INTEGRATION" \
            "$FRONTEND_E2E"; do
            test "$result" = "success"
          done
