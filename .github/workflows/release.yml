name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (empty uses v<VERSION>)"
        required: false
        type: string
      publish:
        description: "Push images and create the GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify releasable source
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
      build_date: ${{ steps.verify.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require green main commit and matching version
        id: verify
        env:
          CANDIDATE_TAG: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          RELEASES_ENABLED: ${{ vars.OPENRBI_RELEASES_ENABLED }}
        run: |
          set -euo pipefail
          source_version="$(tr -d '[:space:]' < VERSION)"
          tag="${CANDIDATE_TAG:-v${source_version}}"

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          if [[ "${tag#v}" != "$source_version" ]]; then
            echo "Tag $tag does not match VERSION ($source_version)" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must be dispatched from main" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_SHA is not present on main" >&2
            exit 1
          }

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "Release gates" and .conclusion == "success") | .id' \
            | grep -q . || {
              echo "No successful Release gates check exists for $GITHUB_SHA" >&2
              exit 1
            }

          if [[ "$PUBLISH" == "true" ]]; then
            if [[ "$RELEASES_ENABLED" != "true" ]]; then
              echo "Publishing is locked. Set OPENRBI_RELEASES_ENABLED=true only after a successful dry run." >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists" >&2
              exit 1
            fi
          fi

          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "version=$source_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

  images:
    name: Build release image (${{ matrix.component }})
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
          - component: session-agent
            context: session-agent
            dockerfile: session-agent/Dockerfile
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - component: browser
            context: docker/browser
            dockerfile: docker/browser/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and record image identity
        env:
          BUILD_DATE: ${{ needs.preflight.outputs.build_date }}
          COMPONENT: ${{ matrix.component }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          PUBLISH: ${{ inputs.publish }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_ref="ghcr.io/${owner}/openrbi-${COMPONENT}"
          version_ref="${image_ref}:${VERSION}"
          mkdir -p release-metadata

          common_args=(
            --platform linux/amd64
            --file "$DOCKERFILE"
            --build-arg "OPENRBI_VERSION=$VERSION"
            --build-arg "OPENRBI_COMMIT_SHA=$GITHUB_SHA"
            --build-arg "OPENRBI_BUILD_DATE=$BUILD_DATE"
          )

          if [[ "$PUBLISH" == "true" ]]; then
            docker buildx build "${common_args[@]}" \
              --tag "$version_ref" \
              --metadata-file build-metadata.json \
              --push "$CONTEXT"
            digest="$(jq -er '."containerimage.digest"' build-metadata.json)"
            digest_kind="registry_manifest_digest"
          else
            docker buildx build "${common_args[@]}" \
              --tag "$version_ref" \
              --load "$CONTEXT"
            digest="$(docker image inspect --format '{{.Id}}' "$version_ref")"
            digest_kind="local_image_id"
          fi

          if [[ "$PUBLISH" == "true" ]]; then
            sbom_source="registry:${image_ref}@${digest}"
          else
            sbom_source="docker:${version_ref}"
          fi
          sbom_file="${COMPONENT}.cdx.json"
          "$SYFT_CMD" "$sbom_source" \
            --output "cyclonedx-json=release-metadata/${sbom_file}"
          jq -e '
            .bomFormat == "CycloneDX"
            and (.specVersion | type == "string")
            and (.components | type == "array")
          ' "release-metadata/${sbom_file}" >/dev/null
          sbom_spec_version="$(jq -er '.specVersion' "release-metadata/${sbom_file}")"

          jq -n \
            --arg version "$VERSION" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg build_date "$BUILD_DATE" \
            --arg component "$COMPONENT" \
            --arg image "$version_ref" \
            --arg digest "$digest" \
            --arg digest_kind "$digest_kind" \
            --arg sbom_file "$sbom_file" \
            --arg sbom_spec_version "$sbom_spec_version" \
            --argjson published "$PUBLISH" \
            '{version: $version, commit_sha: $commit_sha, build_date: $build_date, component: $component, image: $image, digest: $digest, digest_kind: $digest_kind, published: $published, sbom: {filename: $sbom_file, format: "CycloneDX JSON", spec_version: $sbom_spec_version}}' \
            > "release-metadata/${COMPONENT}.metadata.json"

      - name: Upload image metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata-${{ matrix.component }}
          path: release-metadata/
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Finalize release metadata
    needs: [preflight, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-metadata-*
          path: release-assets
          merge-multiple: true

      - name: Assemble traceable release manifest
        env:
          BUILD_DATE: ${{ needs.preflight.outputs.build_date }}
          PUBLISH: ${{ inputs.publish }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          jq -s \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg build_date "$BUILD_DATE" \
            --argjson published "$PUBLISH" \
            '{version: $version, tag: $tag, commit_sha: $commit_sha, build_date: $build_date, published: $published, images: sort_by(.component)}' \
            release-assets/*.metadata.json > release-metadata.json
          mv release-metadata.json release-assets/release-metadata.json
          (cd release-assets && sha256sum *.json > SHA256SUMS)
          cat release-assets/release-metadata.json

      - name: Upload dry-run/release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ needs.preflight.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          release_args=(--target "$GITHUB_SHA" --title "OpenRBI $TAG" --generate-notes)
          if [[ "$TAG" == *-rc.* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            "${release_args[@]}"
