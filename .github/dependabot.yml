# RBI-POST-013: dependency-update visibility (Dependabot opens PRs; it
# does not auto-merge anything — every update still goes through the
# normal CI/review gate before landing). Weekly, not daily, to avoid a PR
# flood — security-relevant updates for an already-known vulnerability are
# opened by Dependabot as soon as the advisory is published regardless of
# this schedule, so this cadence only controls routine version-bump
# noise, not how fast a real CVE gets a PR.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/session-agent"
    schedule:
      interval: "weekly"
    groups:
      session-agent-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # One entry per Dockerfile — Dependabot's docker ecosystem only reads
  # the FROM line(s) in the file at `directory`, it does not recurse.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/session-agent"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/browser"
    schedule:
      interval: "weekly"

  # Stock images used directly in compose files (reverse-proxy nginx,
  # postgres, valkey, clamav) have no Dockerfile, so the docker ecosystem
  # above never sees them — the reverse proxy sat on the unmaintained
  # nginx 1.27 branch while the frontend image had moved on to 1.31.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    # Major versions of the data stores are migrations, not bumps: a
    # postgres major can't open the previous major's data directory
    # (pg_upgrade or dump/restore, and postgres 18 also moved PGDATA), and
    # valkey majors change persistence/replication formats. They get their
    # own planned change with an upgrade runbook; patch/minor stay automatic.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
