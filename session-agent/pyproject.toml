[project]
name = "openrbi-session-agent"
version = "1.0.1"
description = "OpenRBI Session Agent — the only component holding sandbox-runtime credentials (see docs/adr/0004, 0005)."
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "docker>=7.1",
    "psutil>=6.0",
    # Roadmap B2.1 (docs/adr/0023-node-enrollment-and-trust-model.md) —
    # this agent's own outbound enrollment call (app/enrollment.py).
    # Previously dev-only (test client); now needed at runtime too.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
