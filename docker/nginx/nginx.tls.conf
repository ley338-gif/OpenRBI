# Production reverse-proxy config (Phase 22): terminates TLS on 443 and
# redirects plain 80 to it. Use this instead of nginx.conf for any real
# deployment — see docs/deployment.md#tls. Locally, `docker compose up`
# still uses the plain-HTTP nginx.conf (no certificate required for dev).
#
# Expects fullchain.pem/privkey.pem under /etc/nginx/certs (see
# docker-compose.prod.yml) — standard certbot/Let's Encrypt output layout,
# so a certbot renewal hook can drop renewed files in place without any
# config change here.
user nginx;

events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        # No secrets or app responses ever served here — only the redirect
        # itself, so this is safe to answer before a client has verified
        # the certificate.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Baseline security headers (same as nginx.conf) plus HSTS, which
        # is only meaningful — and only added — once TLS actually exists.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location /api/display/ {
            proxy_pass http://backend:8000/display/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:80/;
        }
    }
}
