# Placeholder reverse-proxy config for local development.
# Phase 22 (Deployment) adds TLS termination, noVNC websocket proxying, and
# hardened default headers. Do not use this as-is in production.

events {}

http {
    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:80/;
        }
    }
}
