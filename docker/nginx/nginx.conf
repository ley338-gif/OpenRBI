# Placeholder reverse-proxy config for local development.
# Phase 22 (Deployment) adds TLS termination and hardened default headers.
# Do not use this as-is in production.

events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # WebSocket path for the noVNC display relay (Phase 8) — must come
        # before the general /api/ location so it gets the Upgrade headers
        # instead of being treated as a plain HTTP proxy pass.
        location /api/display/ {
            proxy_pass http://backend:8000/display/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:80/;
        }
    }
}
