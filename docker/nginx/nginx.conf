# Plain-HTTP reverse-proxy config for local development. For a real
# deployment use docker-compose.prod.yml instead, which switches to
# nginx.tls.conf (TLS termination + HSTS on top of the same headers/
# locations below) — see docs/deployment.md#tls. Do not use this config
# as-is in production; it never gets HSTS since it has no certificate.

# Matches the base nginx:1.27-alpine image's own default (see its
# /etc/nginx/nginx.conf) — without this, nginx's master process never drops
# from root to the unprivileged "nginx" worker user, the opposite of
# hardening. docker-compose.yml grants exactly the capabilities this drop
# needs (CHOWN/SETUID/SETGID for the drop itself, NET_BIND_SERVICE for
# port 80), nothing more.
user nginx;

events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Baseline security headers, TLS-independent (HSTS needs a real
        # certificate first — see nginx.tls.conf).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # WebSocket path for the noVNC display relay (Phase 8) — must come
        # before the general /api/ location so it gets the Upgrade headers
        # instead of being treated as a plain HTTP proxy pass.
        location /api/display/ {
            proxy_pass http://backend:8000/display/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:80/;
        }
    }
}
