# Plain-HTTP reverse-proxy config for local development. For a real
# deployment use docker-compose.prod.yml instead, which switches to
# nginx.tls.conf (TLS termination + HSTS on top of the same headers/
# locations below) — see docs/deployment.md#tls. Do not use this config
# as-is in production; it never gets HSTS since it has no certificate.

# Matches the base nginx:1.27-alpine image's own default (see its
# /etc/nginx/nginx.conf) — without this, nginx's master process never drops
# from root to the unprivileged "nginx" worker user, the opposite of
# hardening. docker-compose.yml grants exactly the capabilities this drop
# needs (CHOWN/SETUID/SETGID for the drop itself, NET_BIND_SERVICE for
# port 80), nothing more.
user nginx;

events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Baseline security headers, TLS-independent (HSTS needs a real
        # certificate first — see nginx.tls.conf).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # RBI-POST-022: everything is self-hosted (no CDN fonts/scripts, no
        # inline <script>, confirmed by reading both portals' index.html
        # and package.json) so default-src 'self' is realistic without a
        # long allowlist. style-src needs 'unsafe-inline' because several
        # components use React's inline style={{}} prop (a real, current
        # constraint, not a placeholder to fix later — a nonce/hash scheme
        # for dynamic inline styles is disproportionate for this patch
        # release); script-src does not, since nothing in either portal
        # emits an inline <script> or relies on eval(). 'wasm-unsafe-eval'
        # covers @novnc/novnc's WASM decoder path without granting general
        # eval(). connect-src 'self' covers the noVNC display relay's
        # same-origin WebSocket upgrade (ws:/wss: to the same host is
        # matched by 'self', not a separate scheme entry). See
        # docs/security-model.md#content-security-policy-rbi-post-022.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # WebSocket path for the noVNC display relay (Phase 8) — must come
        # before the general /api/ location so it gets the Upgrade headers
        # instead of being treated as a plain HTTP proxy pass.
        location /api/display/ {
            proxy_pass http://backend:8000/display/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # $http_host, not $host: $host silently strips a non-default
            # port from the forwarded Host header, but the client's Origin
            # header never does. app/api/display.py's WS handshake compares
            # them for CSRF-equivalent origin validation (a WS upgrade can't
            # carry the app's normal CSRF header) -- with $host, that
            # comparison always fails on any deployment not on port 80/443,
            # including this project's own documented default of 8080,
            # permanently breaking every Secure Browser session.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:80/;
        }
    }
}
