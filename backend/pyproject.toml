[project]
name = "openrbi-backend"
version = "1.0.1-rc.2"
description = "OpenRBI control-plane API"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "cryptography>=43.0",
    "qrcode[pil]>=8.0",
    "httpx>=0.27",
    "python-magic>=0.4.27",
    "python-ldap>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=13.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app/db/session.py's engine and app/core/redis.py's client are both
# @lru_cache'd singletons, created once against whichever event loop is
# running at first use (matching production's single long-lived uvicorn
# loop). pytest-asyncio's default is a fresh loop per test function, which
# breaks those cached connections on the second test ("Future attached to a
# different loop") — share one loop for the whole session instead.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
